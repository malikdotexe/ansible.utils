---
name: "Test Codecov Integration"

on:
  workflow_dispatch:

jobs:
  codecov-test:
    name: "Codecov Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core pytest pytest-cov pytest-ansible-units pytest-forked pytest-xdist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests with Coverage
        run: pytest tests/unit -v --cov-report xml --cov=./ -o 'addopts='

      - name: Verify coverage.xml exists
        run: |
          echo "=== Coverage report generated ==="
          ls -la coverage.xml
          head -5 coverage.xml
          echo "=== Coverage summary ==="
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = root.attrib.get('line-rate', 'N/A')
          print(f'Line coverage rate: {float(rate)*100:.1f}%')
          "

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
